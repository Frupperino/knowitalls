<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KnowItAlls</title>
<meta name="description" content="Familjens frågesport för fjällveckan.">
<meta name="theme-color" content="#c8372d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KnowItAlls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: en smal mobilkolumn, flikar fast i botten, ledkryss-rött som enda accent */
:root{
  --bg:#edf1f3; --surface:#ffffff; --sunk:#e2e8eb; --fg:#13202a; --muted:#5b6c77; --line:#d3dce1;
  --accent:#c8372d; --accent-fg:#ffffff; --good:#2e7d4f; --bad:#b3362c;
  --o0:#c8372d; --o1:#22609f; --o2:#b8800f; --o3:#2e7d4f;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c151d; --surface:#15212b; --sunk:#1c2a35; --fg:#e6edf1; --muted:#90a2ad; --line:#263744;
  --accent:#ff5d4f; --accent-fg:#1a0705; --good:#4cc283; --bad:#ff6b5e;
  --o0:#d9443a; --o1:#2f74bd; --o2:#c99419; --o3:#2f8f5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151d; --surface:#15212b; --sunk:#1c2a35; --fg:#e6edf1; --muted:#90a2ad; --line:#263744;
  --accent:#ff5d4f; --accent-fg:#1a0705; --good:#4cc283; --bad:#ff6b5e;
  --o0:#d9443a; --o1:#2f74bd; --o2:#c99419; --o3:#2f8f5a; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:5px;background:var(--accent);border-radius:1px}
.mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;line-height:1}
.kv{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-weight:600;font-size:14px;max-width:50%;min-width:0}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--display);font-size:20px;font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h3{margin:0;font-size:15px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:8px 13px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:17px;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.emo{font-size:22px;padding:6px 9px}
/* fråga */
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.timer{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .2s linear}
.q{font-family:var(--body);font-weight:700;font-size:clamp(21px,5.6vw,27px);line-height:1.22;margin:4px 0 2px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{border:0;border-radius:12px;padding:16px 14px;text-align:left;font-size:18px;font-weight:600;color:#fff;display:flex;gap:12px;align-items:center;min-height:62px;position:relative}
.opt b{font-family:var(--display);font-weight:400;font-size:15px;width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.opt .cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px;opacity:.9}
.o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.32}
.opt.mine{outline:4px solid var(--fg);outline-offset:2px}
.opt.right{box-shadow:0 0 0 4px var(--good)}
.quote{margin:0;padding:18px 18px 18px 52px;background:var(--sunk);border-radius:12px;position:relative;font-size:clamp(19px,5vw,23px);line-height:1.3;font-weight:600;font-style:italic;text-wrap:balance}
.quote::before{content:"\201D";position:absolute;left:12px;top:-6px;font-family:var(--display);font-style:normal;font-size:64px;line-height:1;color:var(--accent)}
.pal{display:flex;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pal i{flex:1}
.photo{display:block;width:100%;padding:0;border:0;background:var(--sunk);border-radius:12px;overflow:hidden;position:relative}
.photo img{display:block;width:100%;max-height:42vh;object-fit:cover}
.photo span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
#zoom{position:fixed;inset:0;background:#000;z-index:20;overflow:auto;display:flex;flex-direction:column}
#zoom .zbar{position:sticky;top:0;left:0;display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.7)}
#zoom .zbar button{background:#fff;color:#000;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
#zoom img{width:100%;height:auto;margin:auto 0}
#zoom.big img{width:260%;max-width:none}
.upload{display:block;text-align:center;padding:16px;border-style:dashed;cursor:pointer}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}
/* spelbräde: fjälleden, pjäserna är html ovanpå svg:n så de kan glida mellan rutorna */
.trail{gap:6px;padding-bottom:10px}
.trail .row{justify-content:space-between}
.trail .row>*{flex:0 1 auto}
.board{position:relative;width:100%;aspect-ratio:360/190;max-width:100%}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.pawn{position:absolute;font-size:20px;line-height:1;transform:translate(-50%,-90%);transition:left .9s cubic-bezier(.3,.7,.3,1),top .9s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));pointer-events:none}
.pawn.me{font-size:24px;z-index:2}
@media (prefers-reduced-motion:reduce){.pawn{transition:none}}
.answered{display:flex;flex-wrap:wrap;gap:6px;font-size:22px;min-height:30px}
.answered .nope{opacity:.25}
.lock{text-align:center;font-weight:600;color:var(--muted)}
.host{border-style:dashed}
.big{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
/* topplista */
.lb{display:flex;flex-direction:column}
.lbr{display:grid;grid-template-columns:30px 34px 1fr auto;gap:8px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.lbr:first-child{border-top:0}
.rank{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.lbr.top .rank{color:var(--accent)}
.av{font-size:24px;text-align:center}
.nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.sc{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:flex;gap:8px;align-items:center}
.log span{flex:1;min-width:0}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;text-decoration:underline}
.notice{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:transparent;padding:14px 4px 16px;font-weight:600;font-size:15px;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);z-index:6;text-align:center}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true"></div>
    <div><div class="brand">KnowItAlls</div><div class="kv" id="kvall">Kväll 1</div></div>
    <button class="me" id="mechip" data-act="switch" hidden></button>
  </header>
  <div id="net" class="notice" hidden></div>
  <section id="trail" class="card trail" hidden>
    <div class="row"><h3>Leden mot toppen</h3><span class="kv">Ikväll · 1 ruta = 100 poäng</span></div>
    <div class="board" id="board"></div>
  </section>
  <main id="view"><div class="card"><h2>Laddar…</h2><p class="hint">Hämtar spelare och poäng.</p></div></main>
</div>
<nav><div>
  <button data-tab="play" aria-current="page">Spela</button>
  <button data-tab="board">Topplista</button>
  <button data-tab="custom">Egna frågor</button>
</div></nav>
<div id="toast" hidden></div>
<div id="zoom" hidden><div class="zbar"><button data-act="zoomsize">Zooma</button><button data-act="zoomclose">Stäng</button></div><img alt="Förstorad bild"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
// Första fältet: kategori + valfri svårighet (1 lätt/barn, 2 medel, 3 svår), t.ex. "F3".
// Utan siffra är Barnkultur 1 och allt annat 2. ":q" är citat (fråga|citat|svar...), ":p" färgpalett (fråga|#hex,#hex|svar...)
const BANK = RAW.trim().split('\n').map(l=>{
  const f=l.split('|'),[head,t]=f[0].split(':'),cat=head[0],d=Number(head[1])||(cat==='B'?1:2);
  if(t==='q')return {id:'b'+hash(f[2]),cat,d,type:'quote',q:f[1],quote:f[2],a:f[3],w:f.slice(4)};
  if(t==='p')return {id:'b'+hash(f[2]+f[3]),cat,d,type:'palette',q:f[1],palette:f[2].split(','),a:f[3],w:f.slice(4)};
  return {id:'b'+hash(f[1]),cat,d,type:'text',q:f[1],a:f[2],w:f.slice(3)};
});

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function dayKey(t){const d=new Date(t-6*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

async function write(fn){
  try{await fn();return true}
  catch(e){
    if(e && e.code==='permission-denied'){S.readonly=true;toast('Databasen tar inte emot ändringar. Kolla reglerna i Firebase.')}
    else if(e && e.code==='resource-exhausted'){toast('Gratiskvoten för idag är slut.')}
    else toast('Kunde inte spara. Kolla nätet och försök igen.');
    render();return false;
  }
}

function standings(filter){
  const tot={};for(const id in S.players)tot[id]=0;
  for(const p of S.all){if(filter&&!filter(p))continue;if(p.player in tot)tot[p.player]+=p.pts||0}
  return Object.entries(tot).sort((a,b)=>b[1]-a[1]);
}
function lbRows(list,sub){
  if(!list.length)return '<p class="hint">Inga spelare än.</p>';
  let rank=0,prev=null;
  return '<div class="lb">'+list.map(([id,sc],i)=>{if(sc!==prev){rank=i+1;prev=sc}
    return `<div class="lbr${rank<=3&&sc>0?' top':''}"><div class="rank">${rank}</div><div class="av">${pemo(id)}</div>
    <div class="nm">${esc(pname(id))}${sub?`<small>${esc(sub(id))}</small>`:''}</div><div class="sc">${sc}</div></div>`}).join('')+'</div>';
}

const okColor=c=>/^#[0-9a-f]{3,8}$/i.test(c)?c:'#888888';

function stim(q){

function viewReveal(){

// PIN-koden hindrar att någon råkar trycka fel. Den är inget riktigt skydd: alla med länken kan skriva i databasen.
async function pinHash(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('knowitalls:'+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAdmin(){try{return !!S.adminHash&&localStorage.getItem('kia-admin')===S.adminHash}catch(e){return false}}

  if(!isAdmin())return `<section class="card host"><h2>Admin</h2>
    <div class="row"><input id="apin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off" style="flex:1 1 120px"><button class="ghost" data-act="adminunlock" style="flex:0 0 auto">Lås upp</button></div></section>`;

      <button class="x" data-act="adminkid" data-id="${id}">${isKid(id)?'Barn → vuxen':'Vuxen → barn'}</button>
      <button class="x" data-act="admindelp" data-id="${id}">${cLabel('ap'+id,'Ta bort')}</button></div>`).join('')}</div>`:'<p class="hint">Inga spelare.</p>'}
    <div class="label">Nollställ</div>

// Raderar i omgångar om högst 400, Firestore tar max 500 per batch
async function deleteDocs(paths){
  for(let i=0;i<paths.length;i+=400){const b=S.db.batch();paths.slice(i,i+400).forEach(p=>b.delete(S.db.doc(p)));await b.commit()}
}
function gamePaths(){return ['game/live','game/used',...Object.keys(S.rounds).map(r=>'game/'+r)]}
async function adminAct(act,b){
  const db=S.db;
  if(act==='adminset'||act==='adminunlock'){
    const pin=($('#apin').value||'').trim();
    if(!/^\d{4,8}$/.test(pin)){toast('PIN-koden ska vara 4–8 siffror.');return}
    const h=await pinHash(pin);
    if(act==='adminset'){if(!await write(()=>db.doc('game/admin').set({pin:h})))return}
    else if(h!==S.adminHash){toast('Fel PIN-kod.');return}
    try{localStorage.setItem('kia-admin',h)}catch(e){toast('Telefonen kan inte komma ihåg att du är admin.')}
    $('#apin').value='';toast('Du är admin på den här telefonen.');render();return;
  }
  if(!isAdmin())return;
  if(act==='adminlock'){try{localStorage.removeItem('kia-admin')}catch(e){}render();return}
  if(act==='adminend'){if(confirmed('aend')&&S.live)await endRound('lobby');return}
  if(act==='adminkid'){write(()=>db.doc('players/'+b.dataset.id).update({kid:!isKid(b.dataset.id)}));return}
  if(act==='admindelp'){if(confirmed('ap'+b.dataset.id))write(()=>db.doc('players/'+b.dataset.id).delete());return}
  if(act==='adminresetpts'){if(confirmed('arp')&&await write(()=>deleteDocs([...S.pts.map(p=>'points/'+p._id),...gamePaths()])))toast('Poängen är nollställda.');return}
  if(act==='adminresetall'){if(confirmed('ara')&&await write(()=>deleteDocs([...S.pts.map(p=>'points/'+p._id),...gamePaths(),...Object.keys(S.players).map(id=>'players/'+id)])))toast('Allt är rensat.');return}
  if(act==='adminresetq'){if(confirmed('arq')&&await write(()=>deleteDocs(S.custom.map(c=>'custom/'+c._id))))toast('De egna frågorna är borttagna.');return}
}

  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));

  if(S.me&&S.players[S.me]){mc.hidden=false;mc.innerHTML=`<span>${pemo(S.me)}</span><span>${esc(pname(S.me))}</span>`}else mc.hidden=true;

}

// ---------- spelbräde ----------
// 36 rutor i tre rader som slingrar sig uppåt, från dalen nere till vänster till toppen uppe till höger
const TILES=36,PER_ROW=12;
function tilePos(i){
  const r=Math.floor(i/PER_ROW),k=i%PER_ROW,step=320/(PER_ROW-1);
  return {x:r%2===0?20+k*step:340-k*step,y:165-r*55};
}
function boardSvg(){
  const pts=[...Array(TILES).keys()].map(tilePos);
  const path='M'+pts.map(p=>p.x.toFixed(1)+' '+p.y).join(' L');
  const dots=pts.map((p,i)=>i===0||i===TILES-1?'':`<circle cx="${p.x.toFixed(1)}" cy="${p.y}" r="6.5" fill="var(--o${i%4})" opacity="${i%6===5?1:.55}"/>`).join('');
  const s=pts[TILES-1],z=pts[0];
  return `<svg viewBox="0 0 360 190" aria-hidden="true">
    <polygon points="0,190 60,120 105,150 190,60 245,105 300,25 360,90 360,190" fill="var(--sunk)"/>
    <polygon points="300,25 284,45 296,42 304,50 314,40" fill="var(--surface)"/>
    <path d="${path}" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 5"/>
    ${dots}
    <rect x="${z.x-9}" y="${z.y-9}" width="18" height="18" rx="4" fill="var(--surface)" stroke="var(--line)"/>
    <text x="${z.x}" y="${z.y+24}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">Dalen</text>
    <line x1="${s.x}" y1="${s.y+6}" x2="${s.x}" y2="${s.y-26}" stroke="var(--fg)" stroke-width="2"/>
    <polygon points="${s.x},${s.y-26} ${s.x+16},${s.y-20} ${s.x},${s.y-14}" fill="var(--accent)"/>
    <text x="${s.x-6}" y="${s.y+22}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">Toppen</text>
  </svg>`;
}

function updateBoard(){
  const box=$('#trail'),ids=Object.keys(S.players);
  const show=!S.noDb&&S.loaded.players&&ids.length>0&&S.tab!=='custom'&&!(S.tab==='play'&&(S.live?.status==='question'||!S.me||!S.players[S.me]));
  box.hidden=!show;if(!show)return;
  const board=$('#board');if(!board.querySelector('svg'))board.innerHTML=boardSvg();
  const tonight=dayKey(Date.now()),tile={};
  for(const [id,sc] of standings(p=>p.day===tonight))tile[id]=Math.max(0,Math.min(TILES-1,Math.floor(sc/100)));
  const byTile={};ids.forEach(id=>(byTile[tile[id]]=byTile[tile[id]]||[]).push(id));
  for(const [id,el] of pawnEls)if(!S.players[id]){el.remove();pawnEls.delete(id)}
  for(const t in byTile){
    const group=byTile[t],p=tilePos(Number(t));
    group.forEach((id,j)=>{
      let el=pawnEls.get(id);
      if(!el){el=document.createElement('span');el.className='pawn';board.appendChild(el);pawnEls.set(id,el)}
      el.textContent=pemo(id);el.title=pname(id);el.classList.toggle('me',id===S.me);
      const dx=(j-(group.length-1)/2)*Math.min(11,60/group.length);
      el.style.left=`calc(${p.x/360*100}% + ${dx}px)`;el.style.top=`${p.y/190*100}%`;
    });
  }
}

// ---------- spellogik ----------
function poolFor(cat){
  // Egna frågor passar alla: de räknas som medel för vuxna och tas också med för barn
  const custom=S.custom.map(c=>({id:'c-'+c._id,cat:'E',d:2,all:true,type:c.img?'photo':'text',ref:c.img?c._id:null,q:c.q,a:c.a,w:c.w||[]})).filter(c=>c.q&&c.a&&c.w.length===3);
  if(cat==='E')return custom;
  if(cat==='X')return BANK.concat(custom);
  return BANK.filter(q=>q.cat===cat);
}

// Plockar n frågor i prioritetsordning [filter, max], helst sådana som inte körts än veckan
function pickQs(pool,n,want){
  const used=new Set(S.used),out=[],ids=new Set();
  const add=(list,max)=>{for(const q of shuffle(list)){if(out.length>=n||max<=0)break;if(ids.has(q.id))continue;out.push(q);ids.add(q.id);max--}};
  for(const [f,max] of want)add(pool.filter(q=>f(q)&&!used.has(q.id)),max);
  for(const [f] of want)add(pool.filter(f),n);
  return shuffle(out);
}
// Firestore tar inte emot undefined, så bara de fält som frågetypen har kopieras
function toLive(q){
  const o=shuffle([q.a,...q.w]),r={id:q.id,cat:q.cat,type:q.type||'text',q:q.q,o,c:o.indexOf(q.a)};
  if(q.quote)r.quote=q.quote;if(q.palette)r.palette=q.palette;if(q.ref)r.ref=q.ref;return r;
}
// Varianten som en viss spelare ska se
const qFor=(L,i,pid)=>{const b=L.qs[i];return b.kid&&isKid(pid)?b.kid:b};

async function startRound(){
  const {cat,n,dur}=S.setup,pool=poolFor(cat);
  if(!pool.length){toast(cat==='E'?'Lägg till egna frågor först, under Egna frågor.':'Inga frågor i den kategorin.');return}
  // Vuxna: ungefär 60 % svåra, resten medel
  const adult=pickQs(pool,n,[[q=>q.d===3,Math.ceil(n*0.6)],[q=>q.d===2,n],[q=>q.d===3,n],[q=>q.d===1,n]]);
  let kid=[];
  if(Object.values(S.players).some(p=>p.kid)){
    const easy=q=>q.d===1||q.all,kidPool=pool.concat(BANK.filter(q=>q.d===1&&!pool.includes(q)));
    kid=pickQs(kidPool,adult.length,[[q=>easy(q)&&(q.cat===cat||cat==='X'||cat==='E'),n],[easy,n],[q=>q.d===2&&q.cat===cat,n]]);
  }
  const pick=adult.concat(kid);
  const qs=adult.map((q,i)=>{const r=toLive(q);if(kid[i]&&kid[i].id!==q.id)r.kid=toLive(kid[i]);return r});
  const batch=S.db.batch();
  // Slå ihop svar som blivit kvar från rundor som aldrig avslutades
  for(const rid of new Set(S.pts.filter(p=>p.kind==='quiz').map(p=>p.roundId)))addRoundSummary(batch,rid);
  batch.set(S.db.doc('game/live'),{status:'question',roundId:'r'+Date.now().toString(36),cat,qs,idx:0,qStart:Date.now(),dur,host:S.me,day:dayKey(Date.now())});
  batch.set(S.db.doc('game/used'),{ids:[...new Set([...S.used,...pick.map(q=>q.id)])]});
  await write(()=>batch.commit());
}

// Ett dokument per runda i stället för ett per svar, så att varje telefon läser lite när appen öppnas
function addRoundSummary(batch,roundId){
  const raw=S.pts.filter(p=>p.kind==='quiz'&&p.roundId===roundId);if(!raw.length)return;
  const prev=S.rounds[roundId],scores=JSON.parse(JSON.stringify(prev?.scores||{}));
  for(const p of raw){const s=scores[p.player]||(scores[p.player]={pts:0,right:0});s.pts+=p.pts||0;if(p.correct)s.right++}
  const cat=prev?.cat||(S.live?.roundId===roundId?S.live.cat:'');
  batch.set(S.db.doc('game/'+roundId),{type:'round',day:prev?.day||raw[0].day,at:prev?.at||Date.now(),cat,scores});
  raw.forEach(p=>batch.delete(S.db.doc('points/'+p._id)));
}
function endRound(status){
  const batch=S.db.batch();addRoundSummary(batch,S.live.roundId);
  batch.update(S.db.doc('game/live'),{status});
  return write(()=>batch.commit());
}
function rebuild(){
  S.all=S.pts.filter(p=>!(p.kind==='quiz'&&S.rounds[p.roundId]))
    .map(p=>({player:p.player,pts:p.pts||0,right:p.correct?1:0,day:p.day,roundId:p.roundId,kind:p.kind}))
    .concat(Object.entries(S.rounds).flatMap(([rid,r])=>Object.entries(r.scores||{}).map(([pl,s])=>({player:pl,pts:s.pts||0,right:s.right||0,day:r.day,roundId:rid,kind:'round'}))));
}

async function answer(i){
  const L=S.live;if(!L||L.status!=='question'||pointFor(L.roundId,L.idx,S.me))return;
  const rem=remaining();if(rem<=0)return;
  const q=qFor(L,L.idx,S.me),correct=i===q.c,pts=correct?100+Math.round(50*rem/(L.dur*1000)):0;
  await write(()=>S.db.doc('points/'+qKey(L.roundId,L.idx,S.me)).set({player:S.me,pts,correct,choice:i,roundId:L.roundId,idx:L.idx,day:L.day,kind:'quiz',at:Date.now()}));
}

function tick(){
  const L=S.live;if(!L||L.status!=='question')return;
  const rem=remaining(),key=L.roundId+'-'+L.idx;
  const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,Math.min(100,rem/(L.dur*10)))+'%';
  const num=$('#tnum');if(num)num.textContent=Math.max(0,Math.ceil(rem/1000));
  if(rem<=0&&S.timeoutKey!==key){S.timeoutKey=key;render();return}
  if(isHost()&&S.revealSent!==key){
    const ids=Object.keys(S.players),all=ids.length>0&&ids.every(p=>pointFor(L.roundId,L.idx,p));
    if(rem<=-400||all){S.revealSent=key;write(()=>S.db.doc('game/live').update({status:'reveal'}))}
  }
}
setInterval(tick,200);

function onLive(){
  const L=S.live;if(!L||L.status!=='question')return;
  const key=L.roundId+'-'+L.idx;
  if(key!==S.seenKey){S.seenKey=key;S.seenAt=Date.now()}
}

// ---------- klick ----------
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;S.confirm=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,L=S.live,db=S.db;
  if(act==='switch'){setMe(null);S.tab='play';render();return}
  if(act==='pick'){setMe(b.dataset.id);render();return}
  if(act==='emo'){S.emoji=b.dataset.e;render();return}
  if(act==='cat'){S.setup.cat=b.dataset.v;render();return}
  if(act==='set'){S.setup[b.dataset.f]=Number(b.dataset.v);render();return}
  if(act==='zoom'){const c=S.custom.find(x=>x._id===b.dataset.ref);if(c&&okImg(c.img)){const z=$('#zoom');z.querySelector('img').src=c.img;z.classList.remove('big');z.hidden=false}return}
  if(act==='zoomsize'){$('#zoom').classList.toggle('big');return}
  if(act==='zoomclose'){$('#zoom').hidden=true;return}
  if(act==='ctype'){S.ctype=b.dataset.v;render();return}
  if(act==='level'){S.kidSel=b.dataset.v==='1';render();return}
  if(act==='mylevel'&&S.db&&S.me){write(()=>S.db.doc('players/'+S.me).update({kid:!isKid(S.me)}));return}
  if(act==='cimgclear'){S.cimg=null;render();return}
  if(!db)return;
  if(act==='join'||act==='addplayer'){
    const inp=$(act==='join'?'#jn':'#an'),name=(inp.value||'').trim();if(!name){toast('Skriv ett namn först.');inp.focus();return}
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(await write(()=>db.doc('players/'+id).set({name,emoji:S.emoji,kid:!!S.kidSel,at:Date.now()}))){
      inp.value='';if(act==='join')setMe(id);else toast(name+' är med.');render()}
    return;
  }
  if(act==='start'){b.disabled=true;await startRound();return}
  if(act==='ans'){answer(Number(b.dataset.i));return}
  if(act==='reveal'&&L){S.revealSent=L.roundId+'-'+L.idx;write(()=>db.doc('game/live').update({status:'reveal'}));return}
  if(act==='abort'){if(confirmed('abort'))endRound('lobby');return}
  if(act==='takeover'){if(confirmed('takeover'))write(()=>db.doc('game/live').update({host:S.me}));return}
  if(act==='next'&&L){
    if(L.idx+1<L.qs.length)write(()=>db.doc('game/live').update({status:'question',idx:L.idx+1,qStart:Date.now()}));
    else endRound('final');
    return;
  }
  if(act==='lobby'){write(()=>db.doc('game/live').update({status:'lobby'}));return}
  if(act==='manual'&&L){
    const id=b.dataset.id,k=qKey(L.roundId,L.idx,id),p=S.pmap[k];
    if(p&&p.manual)write(()=>db.doc('points/'+k).delete());
    else if(!p)write(()=>db.doc('points/'+k).set({player:id,pts:100,correct:true,choice:qFor(L,L.idx,id).c,manual:true,roundId:L.roundId,idx:L.idx,day:L.day,kind:'quiz',at:Date.now()}));
    return;
  }
  if(act==='bonus'){
    const pl=$('#bp').value,v=Math.round(Number($('#bv').value)),reason=($('#br').value||'').trim();
    if(!pl||!v){toast('Välj spelare och skriv antal poäng.');return}
    if(await write(()=>db.collection('points').add({player:pl,pts:v,kind:'bonus',reason:reason||'Bonus',day:dayKey(Date.now()),at:Date.now(),by:S.me||null}))){
      $('#bv').value='';$('#br').value='';toast((v>0?'+':'')+v+' till '+pname(pl));render()}
    return;
  }
  if(act==='delbonus'){if(confirmed('b'+b.dataset.id))write(()=>db.doc('points/'+b.dataset.id).delete());return}
  if(act==='addq'){
    const g=id=>($(id).value||'').trim(),q=g('#cq'),a=g('#ca'),w=[g('#cw1'),g('#cw2'),g('#cw3')];
    const photo=S.ctype==='photo';
    if(photo&&!S.cimg){toast('Ta eller välj en bild först.');return}
    if(!q||!a||w.some(x=>!x)){toast('Fyll i frågan, rätt svar och tre fel svar.');return}
    if(new Set([a,...w].map(x=>x.toLowerCase())).size<4){toast('Alla fyra svar måste vara olika.');return}
    const doc={q,a,w,by:S.me,at:Date.now()};if(photo)doc.img=S.cimg;
    if(await write(()=>db.collection('custom').add(doc))){['#cq','#ca','#cw1','#cw2','#cw3'].forEach(id=>$(id).value='');S.cimg=null;toast('Frågan är tillagd.');render()}
    return;
  }
  if(act==='delq'){if(confirmed('q'+b.dataset.id))write(()=>db.doc('custom/'+b.dataset.id).delete());return}
  if(act.startsWith('admin')){adminAct(act,b);return}
});

// Fotot krymps till max 900 px och ca 130 kB så att det ryms i ett Firestore-dokument
async function shrink(file){
  const url=URL.createObjectURL(file),img=new Image();
  try{await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url})}finally{URL.revokeObjectURL(url)}
  const s=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let q=0.72,d=c.toDataURL('image/jpeg',q);
  while(d.length>180000&&q>0.3){q-=0.1;d=c.toDataURL('image/jpeg',q)}
  return d;
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='cf'||!e.target.files||!e.target.files[0])return;
  try{S.cimg=await shrink(e.target.files[0]);render()}catch(err){toast('Kunde inte läsa bilden. Prova en annan.')}
});

// ---------- start ----------
async function init(){
  try{S.me=localStorage.getItem('fjk-me')}catch(e){}
  if(!window.firebase||!window.FIREBASE_CONFIG){S.noDb=true;render();return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore();
  // Spara lokalt så att svar och poäng köas om nätet i stugan svajar
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  const db={doc:p=>fs.doc(p),collection:p=>fs.collection(p),batch:()=>fs.batch()};
  S.db=db;
  const staleT=setTimeout(()=>{S.stale=true;render()},10000);
  const seen=(name,snap)=>{S.loaded[name]=true;if(!snap.metadata.fromCache){clearTimeout(staleT);S.stale=false}};
  const fail=()=>{clearTimeout(staleT);S.stale=true;render()};
  db.collection('players').onSnapshot(s=>{S.players=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));seen('players',s);render()},fail);
  db.collection('game').onSnapshot(s=>{
    S.live=null;S.used=[];S.rounds={};
    S.adminHash=null;
    for(const d of s.docs){const v=d.data();if(d.id==='live')S.live=v;else if(d.id==='used')S.used=v.ids||[];else if(d.id==='admin')S.adminHash=v.pin||null;else if(v.type==='round')S.rounds[d.id]=v}
    rebuild();seen('game',s);onLive();render()},fail);
  db.collection('points').onSnapshot(s=>{S.pts=s.docs.map(d=>({...d.data(),_id:d.id}));S.pmap={};for(const p of S.pts)if(p.kind==='quiz')S.pmap[qKey(p.roundId,p.idx,p.player)]=p;rebuild();seen('points',s);render()},fail);
  db.collection('custom').onSnapshot(s=>{S.custom=s.docs.map(d=>({...d.data(),_id:d.id}));seen('custom',s);render()},fail);
}
render();
init();
</script>

<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KnowItAlls</title>
<meta name="description" content="Frågesport på svenska. Glid, sortera, hitta udda fågeln och avgör vad som är sant eller bluff.">
<meta name="theme-color" content="#f3eadc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KnowItAlls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3eadc;
  --bg2:#e7dcc8;
  --ink:#1c140f;
  --muted:#5e5146;
  --card:#fffdf8;
  --line:rgba(48,28,12,.14);
  --red:#d63a2c;
  --teal:#0f766e;
  --gold:#a86b12;
  --violet:#5b3aa8;
  --blue:#1d4e89;
  --good:#157a45;
  --bad:#b42318;
  --shadow:0 18px 50px rgba(70,36,12,.1);
  --serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Avenir Next","Segoe UI",sans-serif;
  --slider:#0f766e;
  --order:#a86b12;
  --odd:#5b3aa8;
  --bluff:#d63a2c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  min-height:100vh;min-height:100dvh;
  font-family:var(--sans);font-size:17px;line-height:1.45;
  background:
    radial-gradient(900px 420px at -10% -10%, #ffe7c4 0%, transparent 55%),
    radial-gradient(800px 480px at 110% -5%, #ffd0c8 0%, transparent 50%),
    radial-gradient(700px 500px at 50% 120%, #d7efe6 0%, transparent 46%),
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button{user-select:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.app{
  width:min(1040px,100%);
  margin:0 auto;
  padding:
    calc(18px + env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    calc(28px + env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));
}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:0;font-weight:700;letter-spacing:-.03em;font-size:18px}
.mark{width:26px;height:26px;position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;border-radius:2px;background:var(--red)}
.mark::before{transform:translate(-50%,-50%) rotate(45deg)}
.mark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.top-gap{flex:1}
.scorepill,.iconbtn,.textbtn{
  border:1px solid var(--line);background:rgba(255,253,248,.72);border-radius:999px;
}
.scorepill{display:flex;align-items:baseline;gap:6px;padding:6px 12px 7px}
.scorepill b{font-family:var(--serif);font-size:22px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scorepill span,.who{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;padding:0}
.iconbtn.on{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.iconbtn svg{width:20px;height:20px;display:block}
.textbtn{padding:8px 12px;font-weight:650;font-size:14px;background:transparent}
.kicker{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1,h2,p{text-wrap:balance}
.hero h1{
  font-family:var(--serif);font-weight:560;letter-spacing:-.045em;
  font-size:clamp(46px,8vw,78px);line-height:.92;margin:0 0 12px;
}
.lede{margin:0;max-width:38ch;font-size:18px;color:var(--muted)}
.modes{display:grid;gap:12px}
.mode{
  text-align:left;border-radius:22px;padding:18px 18px 16px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);
}
.mode small{display:block;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.mode strong{display:block;font-family:var(--serif);font-weight:560;font-size:34px;letter-spacing:-.03em;margin:4px 0}
.mode span{color:var(--muted)}
.mode.solo{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.mode.solo small,.mode.solo span{color:rgba(255,253,248,.72)}
.mechs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mech{
  text-align:left;border-radius:16px;padding:12px 12px 11px;border:1px solid var(--line);
  background:rgba(255,253,248,.55);min-height:92px;
}
.mech b{display:block;font-size:15px;margin-bottom:3px}
.mech span{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.mech i{display:block;width:10px;height:10px;border-radius:50%;margin-bottom:8px;background:var(--c,var(--ink))}
.fine{color:var(--muted);font-size:13px;margin:14px 0 0}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:28px;
  box-shadow:var(--shadow);padding:22px 18px 18px;position:relative;
}
.card h2{font-family:var(--serif);font-weight:560;letter-spacing:-.03em;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0 0 8px}
.sub{margin:0 0 16px;color:var(--muted)}
.block{margin:0 0 16px}
.block .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip,.seg button{
  border:1px solid var(--line);background:#f6f0e6;border-radius:999px;padding:10px 12px;font-weight:600;font-size:15px;
}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.names{display:grid;gap:8px}
.namefield{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.namefield input{
  font-size:16px;font-weight:600;color:var(--ink);background:#f6f0e6;border:1px solid var(--line);
  border-radius:12px;padding:12px 12px;width:100%;
}
.primary{
  width:100%;border:0;background:var(--ink);color:#fffdf8;border-radius:16px;
  min-height:56px;font-size:17px;font-weight:700;margin-top:8px;
}
.primary:disabled{opacity:.35;cursor:default}
.ghost{
  width:100%;background:transparent;border:1.5px solid var(--line);border-radius:16px;
  min-height:48px;font-weight:700;margin-top:8px;
}
.rowbtns{display:flex;gap:8px}
.rowbtns>*{flex:1}
.play{width:min(680px,100%);margin:0 auto}
.segs{display:flex;gap:4px;margin:0 0 12px}
.segs i{flex:1;height:6px;border-radius:99px;background:#e6d9c6}
.segs i.done{background:var(--ink)}
.segs i.now{background:var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pill{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;background:#f3e7d4}
.pill[data-type="slider"]{background:#d9f3ee;color:#0c5c56}
.pill[data-type="order"]{background:#fdecc8;color:#7a4e09}
.pill[data-type="odd"]{background:#ece4ff;color:#432b93}
.pill[data-type="bluff"]{background:#fde4dc;color:#9d2e22}
.pill.quiet{background:transparent;border:1px solid var(--line);color:var(--muted);letter-spacing:.04em}
.count{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.q{font-family:var(--serif);font-weight:560;letter-spacing:-.035em;font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 8px}
.hint{margin:0 0 16px;color:var(--muted)}
.svit{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;
  background:#fff4e0;color:#8a4b08;font-weight:800;font-size:13px;letter-spacing:.04em;
}
.svit.hot{background:#ffe1d6;color:#9d2e22}
.readout{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 4px}
.readout b{
  font-family:var(--serif);font-weight:560;letter-spacing:-.04em;
  font-size:clamp(44px,10vw,76px);font-variant-numeric:tabular-nums;line-height:.9;
}
.nudge{
  width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:28px;line-height:1;
}
.sliderwrap{padding:8px 2px 0}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;
}
input[type="range"]:focus{outline:none}
input[type="range"]:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:8px}
input[type="range"]::-webkit-slider-runnable-track{height:10px;background:#efe4d2;border-radius:99px}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;
  background:var(--ink);border:4px solid #fffdf8;box-shadow:0 4px 12px rgba(28,20,15,.25);
}
input[type="range"]::-moz-range-track{height:10px;background:#efe4d2;border-radius:99px;border:0}
input[type="range"]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;background:var(--ink);border:4px solid #fffdf8;
  box-shadow:0 4px 12px rgba(28,20,15,.25);
}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{
  display:flex;align-items:center;gap:10px;min-height:60px;border-radius:16px;
  border:1.5px dashed #d9cbb6;background:#faf6ef;padding:6px 8px 6px 12px;
}
.slot b{font-family:var(--serif);width:22px;color:var(--muted);font-weight:560}
.slot .empty{color:#b3a594;font-weight:600}
.slot.over,.pool.over{border-color:var(--ink);background:#fff}
[data-chip]{
  border:0;background:var(--ink);color:#fffdf8;border-radius:14px;padding:12px 14px;
  font-weight:650;text-align:left;touch-action:none;
}
.slot [data-chip]{flex:1}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;margin-top:12px;padding:8px;border-radius:16px;border:1px dashed transparent}
.pool [data-chip]{max-width:100%}
.lift{opacity:.35}
.wagers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.wagers button{
  border:1px solid var(--line);background:#f6f0e6;border-radius:14px;padding:10px 6px;text-align:center;
}
.wagers button b{display:block;font-size:15px}
.wagers button small{color:var(--muted);font-variant-numeric:tabular-nums}
.wagers button[aria-pressed="true"]{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.wagers button[aria-pressed="true"] small{color:rgba(255,253,248,.75)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  min-height:84px;border-radius:18px;border:1px solid var(--line);background:#fff;padding:14px;
  text-align:left;font-weight:700;font-size:18px;
}
.choice[aria-pressed="true"]{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{
  min-height:104px;border-radius:20px;border:0;font-family:var(--serif);font-size:30px;font-weight:560;
}
.side.sant{background:#e5f6ec;color:#0f5c38}
.side.bluff{background:#fdeceb;color:#9f2218}
.side[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.lockbar{position:sticky;bottom:0;padding-top:14px;background:linear-gradient(transparent, var(--card) 28%)}
.keys{margin:8px 0 0;color:var(--muted);font-size:13px}
.hand{text-align:center;padding:28px 12px 12px}
.hand .who2{font-family:var(--serif);font-size:clamp(40px,8vw,68px);line-height:.95;letter-spacing:-.04em;margin:8px 0}
.race{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 8px;padding:0;list-style:none}
.race li{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-size:14px}
.race li b{font-weight:700}
.race li em{font-style:normal;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.race .up{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.delta{font-family:var(--serif);font-size:clamp(52px,10vw,76px);letter-spacing:-.045em;line-height:.9;margin:6px 0;font-variant-numeric:tabular-nums}
.goodc{color:var(--good)} .midc{color:var(--gold)} .badc{color:var(--bad)}
.fb.good{background:linear-gradient(#eefbf3,var(--card) 120px)}
.fb.mid{background:linear-gradient(#fff6e4,var(--card) 120px)}
.fb.bad{background:linear-gradient(#fff1ef,var(--card) 120px)}
.note{background:#f6f0e6;border-radius:16px;padding:12px 14px;margin:12px 0}
.note b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cmp{margin:8px 0 4px}
.cmp-track{position:relative;height:12px;border-radius:99px;background:#efe4d2;margin:18px 10px 8px}
.cmp-track i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%)}
.cmp-track .you,.key .you{background:var(--ink)}
.cmp-track .truth,.key .truth{background:var(--teal)}
.cmp-track .truth{box-shadow:0 0 0 3px #fffdf8}
.key{display:flex;gap:14px;color:var(--muted);font-size:13px;font-weight:650}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cmp-order{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.cmp-order li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:10px 12px;border-radius:12px;background:#f6f0e6}
.cmp-order .ok{background:#e5f6ec}
.cmp-order .no{background:#fdeceb}
.cmp-order span{font-family:var(--serif);color:var(--muted)}
.cmp-order div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cmp-order em{font-style:normal;color:var(--muted);font-size:14px}
.narrow{width:min(720px,100%);margin:0 auto}
@media (max-width:520px){
  .top:has(.scorepill) .brand span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
}
.rank{
  font-family:var(--serif);font-weight:560;letter-spacing:-.04em;
  font-size:clamp(40px,7vw,64px);line-height:.95;margin:0 0 8px;
}
.ribbon{
  display:inline-block;background:var(--red);color:#fff;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;font-size:12px;border-radius:999px;padding:5px 10px;margin-bottom:8px;
}
.podium{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.podium li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:#f6f0e6}
.podium .place{font-family:var(--serif);font-size:28px;width:36px}
.podium small{display:block;color:var(--muted)}
.podium b.sc{font-family:var(--serif);font-size:28px;font-weight:560;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.log small{display:block;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.log b{font-variant-numeric:tabular-nums}
.help h3{margin:18px 0 4px;font-size:16px}
.help p{margin:0 0 8px}
#ghost{
  position:fixed;z-index:50;left:0;top:0;pointer-events:none;
  background:var(--ink);color:#fffdf8;padding:10px 14px;border-radius:14px;
  font-weight:700;max-width:min(70vw,320px);box-shadow:0 12px 30px rgba(28,20,15,.28);
}
@media (min-width:900px){
  .home{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;min-height:calc(100dvh - 120px)}
  .card{padding:28px 26px 22px}
  .choices{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
  .choices,.sides,.wagers{grid-template-columns:1fr}
  .wagers{grid-template-columns:1fr 1fr 1fr}
}
@media (pointer:coarse){.keys{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{
  position:absolute;top:-16px;left:calc(var(--x) * 100%);
  width:8px;height:14px;border-radius:2px;background:var(--c);
  animation:fall var(--d) linear forwards;
}
@keyframes fall{to{transform:translateY(105vh) rotate(200deg);opacity:.15}}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">KnowItAlls behöver JavaScript, men ingen server och ingen inloggning.</p></noscript>
<script src="questions.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
